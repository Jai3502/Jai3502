name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate github-contribution-grid-snake
        uses: Platane/snk@v3.1
        with:
          github_user_name: Jai3502
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg
          commit_message: 'Generate snake contribution graph'
          dark_mode: true
          theme: dark

      - name: Generate light snake
        uses: Platane/snk@v3.1
        with:
          github_user_name: Jai3502
          gif_out_path: dist/github-contribution-grid-snake-light.gif
          svg_out_path: dist/github-contribution-grid-snake-light.svg
          commit_message: 'Generate light snake contribution graph'
          dark_mode: false
          theme: light

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snake-graphics
          path: dist/
